# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: [main, codex/metal-max-performance]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Ubuntu,  os: ubuntu-latest, backend: "",        python: python3 }
          - { name: Windows, os: windows-latest, backend: "",       python: python }
          - { name: macOS,   os: macos-latest,   backend: "Metal",  python: python3 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python deps (numpy + gguf for golden gen)
        run: ${{ matrix.config.python }} -m pip install numpy gguf

      - name: Configure
        run: >
          cmake -S . -B build
          -D CMAKE_BUILD_TYPE=Release
          ${{ matrix.config.backend == 'Metal' && '-DPCNSF_METAL=ON' || '' }}
          -D PCNSF_BUILD_TESTS=ON
          -D PCNSF_BUILD_CLI=${{ matrix.config.os != 'windows-latest' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: CTest (golden fixture + core tests, skip vocode-e2e)
        working-directory: build
        run: ctest --output-on-failure -C Release -L core

      - name: CTest all incl extras
        working-directory: build
        run: ctest --output-on-failure -C Release

  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy gguf
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python tests/test_converter.py

  vulkan-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslc spirv-headers
      - run: python -m pip install numpy gguf
      - name: Configure Vulkan
        run: >
          cmake -S . -B build-vulkan -DCMAKE_BUILD_TYPE=Release
          -DPCNSF_VULKAN=ON -DPCNSF_METAL=OFF -DPCNSF_BUILD_CLI=OFF
      - run: cmake --build build-vulkan --parallel 2 --target test_audio_op_regressions test_vulkan_device_policy test_vulkan_convolution
      - name: CPU and Vulkan operator regressions (Mesa software device)
        env:
          # ggml excludes CPU-class Vulkan devices unless explicitly selected.
          GGML_VK_VISIBLE_DEVICES: "0"
        run: |
          build-vulkan/bin/test_audio_op_regressions CPU
          build-vulkan/bin/test_audio_op_regressions Vulkan0
          build-vulkan/bin/test_vulkan_device_policy
          build-vulkan/bin/test_vulkan_convolution Vulkan0
